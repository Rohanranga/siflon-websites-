<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Siflon Group – Asset Review Gallery</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f6f8;margin:0;padding:24px;color:#102A43}
    h1{font-size:24px}
    h2{font-size:18px;border-bottom:2px solid #477A9E;padding-bottom:6px;margin-top:32px}
    .nav{margin-bottom:24px;font-size:14px}
    .nav a{color:#477A9E;text-decoration:none;margin-right:16px}
    .nav a:hover{text-decoration:underline}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:16px 0}
    .card{background:#fff;border:1px solid #dce3e8;border-radius:6px;padding:12px;transition:box-shadow .2s}
    .card:hover{box-shadow:0 4px 16px rgba(16,42,67,.12)}
    .card a{display:block;text-decoration:none;color:inherit}
    .card img{width:100%;height:auto;display:block;border-radius:4px}
    .meta{font-size:12px;color:#647482;margin-top:8px;line-height:1.5}
    .tag{display:inline-block;background:#eef3f6;color:#477A9E;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:6px}
  </style>
</head>
<body>
  <h1>Siflon Group – Asset Review Gallery</h1>
  <div class="nav">
    <a href="#facilities">Facilities</a>
    <a href="#exhibitions">Exhibitions</a>
    <a href="#clients">Clients</a>
  </div>

  <h2 id="facilities">Facilities (12) <span class="tag">Visual inspection pending</span></h2>
  <div class="grid" id="facilities-grid"></div>

  <h2 id="exhibitions">Exhibitions (24) <span class="tag">Visual inspection pending</span></h2>
  <div class="grid" id="exhibitions-grid"></div>

  <h2 id="clients">Clients (12) <span class="tag">Visual inspection pending</span></h2>
  <div class="grid" id="clients-grid"></div>

  <script>
    // Image data from ASSET_REVIEW.csv
    const facilities = [
      "facility_00.jpg","facility_01.jpg","facility_02.jpg","facility_03.jpg",
      "facility_04.jpg","facility_05.jpg","facility_06.jpg","facility_07.jpg",
      "facility_08.jpg","facility_09.jpg","facility_10.jpg","facility_11.jpg"
    ];
    const exhibitions = [
      "exhibition_00.jpg","exhibition_01.jpg","exhibition_02.jpg","exhibition_03.jpg",
      "exhibition_04.jpg","exhibition_05.jpg","exhibition_06.jpg","exhibition_07.jpg",
      "exhibition_08.jpg","exhibition_09.jpg","exhibition_10.jpg","exhibition_11.jpg",
      "exhibition_12.jpg","exhibition_13.jpg","exhibition_14.jpg","exhibition_15.jpg",
      "exhibition_16.jpg","exhibition_17.jpg","exhibition_18.jpg","exhibition_19.jpg",
      "exhibition_20.jpg","exhibition_21.jpg","exhibition_22.jpg","exhibition_23.jpg"
    ];
    const clients = [
      "client_00.jpg","client_01.jpg","client_02.jpg","client_03.jpg",
      "client_04.jpg","client_05.jpg","client_06.jpg","client_07.jpg",
      "client_08.jpg","client_09.jpg","client_10.jpg","client_11.jpg"
    ];

    function buildCards(list, folder, containerId) {
      const container = document.getElementById(containerId);
      list.forEach(filename => {
        const src = `../${folder}/${filename}`;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <a href="${src}" target="_blank" rel="noopener noreferrer">
            <img src="${src}" alt="${filename}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
            <div style="display:none;background:#eef3f6;border:1px dashed #cdd7de;border-radius:4px;padding:24px;text-align:center;color:#647482;font-size:13px;">Failed to load: ${filename}</div>
            <div class="meta">${filename}<br>${folder === 'facilities' ? '1600x1200' : folder === 'exhibitions' ? '1600x1200' : '1600x1067'}</div>
          </a>
        `;
        container.appendChild(card);
      });
    }

    buildCards(facilities, 'facilities', 'facilities-grid');
    buildCards(exhibitions, 'exhibitions', 'exhibitions-grid');
    buildCards(clients, 'clients', 'clients-grid');
  </script>
</body>
</html>
